name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: taylorvance/tv-shared/.github/workflows/verify.yml@v1
    with:
      node-version: '20'
      working-directory: .
      lint-command: npm run lint
      test-command: npm run test -- --run
      build-command: npm run build
